[project]
name = "r2p-enterprise-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.15.0",
    "requests>=2.31.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.12",
    "platformdirs>=4.2.0",
    "httpx-sse>=0.4.0",
    "anyio>=4.0.0",
    "fastmcp>=0.4.0",
    "fastmcp-slim>=0.4.0",
    # FastMCP deps
    "typing-extensions>=4.7",
    "rich>=13.0",
    "click>=8.1",
    "watchfiles>=0.21",
    "jsonschema>=4.23",
    "pydantic-extra-types>=2.9",
    "python-jose[cryptography]>=3.3.0",
    "authlib>=1.3",
    "itsdangerous>=2.2",
]

[build-system]
requires = ["setuptools>=68", "wheel", "cffi>=1.17", "rust>=1.70"]
build-backend = "setuptools.backends.legacy:build"
