<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting…</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }
        .box {
            text-align: center;
            padding: 3rem;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            max-width: 380px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e0e0e0;
            border-top-color: #000;
            border-radius: 50%;
            margin: 0 auto 1.2rem;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a {
            display: inline-block;
            margin-top: 1.2rem;
            color: #000;
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <p><strong>Report history is now on your Dashboard.</strong></p>
        <p style="color:#707070;font-size:.9rem;">Redirecting shortly…</p>
        <a href="/dashboard.html">Go to Dashboard now</a>
    </div>
    <script>
        setTimeout(() => { window.location.replace('/dashboard.html'); }, 400);
    </script>
</body>
</html>
