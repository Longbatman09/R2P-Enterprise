services:
  mcp:
    build:
      context: .
      dockerfile: mcp_backend/Dockerfile
    ports:
      - "8100:8100"
    env_file:
      - mcp_backend/.env.local
    volumes:
      - ./mcp_backend:/app/mcp_backend  # live-reload (remove for prod)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

